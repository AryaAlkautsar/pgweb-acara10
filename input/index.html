<!DOCTYPE html>
<html>
<head>
    <title>Form Input Pendidikan Kota Bandung</title>
</head>
<body>
    <h2>Form Input Data Pendidikan</h2>
    <form action="input.php" onsubmit="return validateForm(event)" method="post">
        <label for="nama">Nama Sekolah:</label><br>
        <input type="text" id="nama" name="nama" value=""><br><br>
        
        <label for="npsn">NPSN:</label><br>
        <input type="text" id="npsn" name="npsn" value=""><br><br>
        
        <label for="bentuk_pendidikan">Bentuk Pendidikan:</label><br>
        <input type="text" id="bentuk_pendidikan" name="bentuk_pendidikan" value=""><br><br>
        
        <label for="status">Status:</label><br>
        <input type="text" id="status" name="status" value=""><br><br>
        
        <label for="alamat">Alamat:</label><br>
        <input type="text" id="alamat" name="alamat" value=""><br><br>
        
        <label for="kelurahan">Kelurahan:</label><br>
        <input type="text" id="kelurahan" name="kelurahan" value=""><br><br>

        <label for="kecamatan">Kecamatan:</label><br>
        <input type="text" id="kecamatan" name="kecamatan" value=""><br><br>
        
        <label for="latitude">Latitude:</label><br>
        <input type="text" id="lat" name="latitude" value=""><br><br>
        
        <label for="longitude">Longitude:</label><br>
        <input type="text" id="long" name="longitude" value=""><br><br>
        
        <input type="submit" value="Submit">
    </form>
    <p id="informasi" style="color: red;"></p>

    <script>
    function validateForm(event) {
        let npsn = document.getElementById("npsn").value;
        let text = "";
        
        // Contoh validasi sederhana: NPSN harus berupa angka
        if (isNaN(npsn) || npsn.trim() === "") {
            text = "NPSN harus diisi dan berupa angka!";
            event.preventDefault();
            document.getElementById("informasi").innerHTML = text;
            return false;
        }
    }
    </script>
</body>
</html>
