<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Input Data Pendidikan</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .form-container {
            background: #ffffff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 450px;
        }
        h2 {
            margin-top: 0;
            color: #333;
            text-align: center;
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 6px;
            font-weight: bold;
            color: #555;
            font-size: 14px;
        }
        input[type="text"] {
            width: 100%;
            padding: 10px;
            margin-bottom: 15px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
            font-size: 14px;
        }
        input[type="text"]:focus {
            border-color: #007bff;
            outline: none;
            box-shadow: 0 0 5px rgba(0, 123, 255, 0.3);
        }
        input[type="submit"] {
            width: 100%;
            background-color: #28a745;
            color: white;
            padding: 12px;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        input[type="submit"]:hover {
            background-color: #218838;
        }
        #informasi {
            margin-top: 10px;
            text-align: center;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <div class="form-container">
        <h2>Form Input Data Pendidikan</h2>
        <form action="../input.php" onsubmit="return validateForm(event)" method="post">
            <label for="nama">Nama Sekolah:</label>
            <input type="text" id="nama" name="nama" value="">
            
            <label for="npsn">NPSN:</label>
            <input type="text" id="npsn" name="npsn" value="">
            
            <label for="bentuk_pendidikan">Bentuk Pendidikan:</label>
            <input type="text" id="bentuk_pendidikan" name="bentuk_pendidikan" value="">
            
            <label for="status">Status:</label>
            <input type="text" id="status" name="status" value="">
            
            <label for="alamat">Alamat:</label>
            <input type="text" id="alamat" name="alamat" value="">
            
            <label for="kelurahan">Kelurahan:</label>
            <input type="text" id="kelurahan" name="kelurahan" value="">

            <label for="kecamatan">Kecamatan:</label>
            <input type="text" id="kecamatan" name="kecamatan" value="">
            
            <label for="latitude">Latitude:</label>
            <input type="text" id="lat" name="latitude" value="">
            
            <label for="longitude">Longitude:</label>
            <input type="text" id="long" name="longitude" value="">
            
            <input type="submit" value="Simpan Data">
        </form>
        <p id="informasi" style="color: red;"></p>
    </div>

    <script>
    function validateForm(event) {
        let npsn = document.getElementById("npsn").value;
        let text = "";
        
        // Validasi sederhana: NPSN harus berupa angka
        if (isNaN(npsn) || npsn.trim() === "") {
            text = "NPSN harus diisi dan berupa angka!";
            event.preventDefault();
            document.getElementById("informasi").innerHTML = text;
            return false;
        }
    }
    </script>
</body>
</html>
